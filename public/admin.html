<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Lazzat</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/styles.css?v=9.1.0"><link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="application-name" content="Lazzat">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lazzat">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
</head>
<body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="brandmark"><i class="fa-solid fa-burger"></i></span><span><b>LAZZAT</b><small>ADMIN PANEL</small></span></a><a class="pill" href="/"><i class="fa-solid fa-house"></i> Sayt</a></div></header><main class="account-wrap"><div class="container"><div class="account-hero"><div><span class="section-kicker">ADMIN</span><h1>Buyurtmalar markazi.</h1><p>Buyurtmalarni ko‘ring va holatini yangilang.</p></div><div class="account-art"><i class="fa-solid fa-chart-line"></i></div></div><div class="panel admin-login"><div class="field"><label>Admin kaliti</label><div class="input-icon"><i class="fa-solid fa-key"></i><input id="key" type="password" placeholder="ADMIN_KEY"></div></div><button class="btn btn-primary" id="load"><i class="fa-solid fa-unlock"></i> Panelni ochish</button><div id="adminNotice" class="notice"></div></div><div id="adminRoot"></div></div></main><script>
const money=n=>`${Number(n).toLocaleString('uz-UZ')} so‘m`; const statuses=['Qabul qilindi','Tayyorlanmoqda','Yo‘lda','Yetkazildi','Bekor qilindi'];
async function loadAdmin(){const key=document.getElementById('key').value.trim();const note=document.getElementById('adminNotice');try{const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':key}}),d=await r.json();if(!d.ok){note.textContent=d.message;note.className='notice show error';return;}note.textContent=`${d.orders.length} ta buyurtma · ${d.users} ta akkaunt`;note.className='notice show success';render(d.orders,key);}catch{note.textContent='Server bilan bog‘lanmadi.';note.className='notice show error';}}
function render(orders,key){const root=document.getElementById('adminRoot');root.innerHTML=`<div class="admin-stats"><div class="stat-card"><i class="fa-solid fa-receipt"></i><b>${orders.length}</b><span>buyurtma</span></div><div class="stat-card"><i class="fa-solid fa-money-bill-wave"></i><b>${money(orders.reduce((s,o)=>s+o.total,0))}</b><span>aylanma</span></div><div class="stat-card"><i class="fa-solid fa-clock"></i><b>${orders.filter(o=>['Qabul qilindi','Tayyorlanmoqda'].includes(o.status)).length}</b><span>jarayonda</span></div></div><div class="panel order-history"><div class="history-head"><h2>Buyurtmalar</h2><button class="pill" onclick="loadAdmin()"><i class="fa-solid fa-rotate"></i> Yangilash</button></div>${orders.length?orders.map(o=>`<article class="admin-order"><div><span class="pill">#${o.id}</span><h3>${o.items.map(i=>`${i.name} × ${i.qty}`).join(', ')}</h3><p>${o.customer.name} · ${o.customer.phone} · ${o.customer.address}</p><small>${new Date(o.createdAt).toLocaleString('uz-UZ')} · ${o.paymentLabel}</small></div><div class="admin-order-side"><strong>${money(o.total)}</strong><select data-id="${o.id}" class="status-select">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div></article>`).join(''):'<div class="empty">Hozircha buyurtmalar yo‘q.</div>'}</div>`;root.querySelectorAll('.status-select').forEach(sel=>sel.addEventListener('change',async()=>{const r=await fetch('/api/admin/orders/'+sel.dataset.id,{method:'PATCH',headers:{'content-type':'application/json','x-admin-key':key},body:JSON.stringify({status:sel.value})});const d=await r.json();if(!d.ok)alert(d.message);}));}
document.getElementById('load').onclick=loadAdmin;</script></body></html>
